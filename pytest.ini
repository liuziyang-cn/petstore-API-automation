[pytest]
log_file = ./log/test.log
log_file_level = info
log_file_format = %(asctime)s %(levelname)s-16s [%(name)s]-5 [%(filename)s]-5 [函数名:%(funcName)s]:[行号]%(lineno)d --%(message)s
log_file_date_format = %Y-%m-%d  %H:%M:%S
addopts = --color=yes
;log_cli = True
;log_cli_level = info
;log_cli_format = %(asctime)s %(levelname)s [%(name)s] [%(filename)s] [函数名:%(funcName)s]:[行号]%(lineno)d --%(message)s
;log_cli_date_format = %Y-%m-%d  %H:%M:%S